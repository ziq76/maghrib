<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Maghrib Cycle Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4 font-sans">

  <main class="w-full max-w-md mt-6 space-y-6">
    <!-- Header -->
    <header class="text-center space-y-1">
      <h1 class="text-2xl font-bold tracking-wide text-emerald-400">KITARAN MAGHRIB</h1>
      <p id="targetDateText" class="text-xs text-slate-400">Menyemak status kitaran...</p>
    </header>

    <!-- Scoreboard -->
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center">
        <span class="text-xs text-slate-400 block uppercase tracking-wider">Hari Berjaya</span>
        <span id="totalWonDays" class="text-4xl font-extrabold text-white">0</span>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center">
        <span class="text-xs text-slate-400 block uppercase tracking-wider">Status Kunci</span>
        <span id="cycleStatusBadge" class="inline-block mt-2 px-3 py-1 text-xs font-semibold rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30">
          Menyemak...
        </span>
      </div>
    </div>

    <!-- Panel Tindakan Rutin -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
      <div>
        <h2 class="text-sm font-semibold text-slate-200">Kunci Hari: <span id="pendingDateLabel" class="text-emerald-400 font-bold">-</span></h2>
        <p class="text-xs text-slate-400 mt-1">Sahkan rutin telah selesai untuk kitaran ini.</p>
      </div>

      <textarea id="notesInput" rows="2" placeholder="Catatan refleksi (pilihan)..." 
        class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"></textarea>

      <div class="flex gap-2">
        <button id="lockBtn" onclick="markTargetComplete()" 
          class="flex-1 py-3.5 px-4 bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] transition font-bold text-slate-950 rounded-xl text-sm shadow-lg shadow-emerald-950">
          Sahkan Berjaya
        </button>
        <button onclick="loadTrackerData()" title="Segerak Semula Data"
          class="px-4 py-3.5 bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-slate-200 rounded-xl text-sm font-bold">
          🔄
        </button>
      </div>
    </section>

    <!-- Sejarah Ringkas -->
    <section class="space-y-2">
      <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Rekod Kitaran (Dari 31/8)</h3>
      <div id="historyList" class="space-y-2 max-h-72 overflow-y-auto pr-1 text-sm">
        <p class="text-slate-500 text-xs">Memuat data...</p>
      </div>
    </section>
  </main>

  <script>
    // 1. KONFIGURASI SUPABASE
    const SUPABASE_URL = "https://jrbbiqchqahyjhkxqmgr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_5NR1DcL0YZ1Z5416-kX_2w_f8la6ycO";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let nextDateToLock = null;

    // Format tarikh ke YYYY-MM-DD ikut waktu lokal
    function formatDateLocal(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // Tambah 1 hari pada format string YYYY-MM-DD
    function addOneDay(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const nextDate = new Date(y, m - 1, d + 1);
      return formatDateLocal(nextDate);
    }

    // Kira tarikh kitaran paling terkini yang DAH BOLEH dikunci
    function getLatestEligibleCycleDate() {
      const now = new Date();
      // Waktu penanda Maghrib hari ini: 7:30 PM
      const todayMaghrib = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 19, 30, 0);

      // Sebelum jam 7:30 PM hari ini (termasuk awal pagi 12-5 AM), kita boleh kunci sehingga semalam
      if (now < todayMaghrib) {
        const yesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
        return formatDateLocal(yesterday);
      }
      // Selepas 7:30 PM hari ini, kitaran hari ini dah tamat dan layak dikunci
      return formatDateLocal(now);
    }

    // 2. MUAT DATA DARI SUPABASE
    async function loadTrackerData() {
      const { data, error } = await db
        .from('maghrib')
        .select('*')
        .order('cycle_date', { ascending: true });

      if (error) {
        console.error("Ralat Supabase:", error);
        return;
      }

      // Kira hari berjaya
      const completedDays = data ? data.filter(item => item.completed).length : 0;
      document.getElementById('totalWonDays').innerText = completedDays;

      // Cari tarikh terakhir disimpan
      let lastSavedDate = "2026-08-30";
      if (data && data.length > 0) {
        lastSavedDate = data[data.length - 1].cycle_date;
      }

      const eligibleDate = getLatestEligibleCycleDate();
      nextDateToLock = addOneDay(lastSavedDate);

      const targetLabel = document.getElementById('pendingDateLabel');
      const badge = document.getElementById('cycleStatusBadge');
      const lockBtn = document.getElementById('lockBtn');
      const infoText = document.getElementById('targetDateText');

      // Jika tarikh dalam DB sudah mencapai had eligible date
      if (lastSavedDate >= eligibleDate) {
        targetLabel.innerText = "Semua Selesai";
        badge.innerText = "Up-to-date";
        badge.className = "inline-block mt-2 px-3 py-1 text-xs font-semibold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        lockBtn.disabled = true;
        lockBtn.innerText = "Tunggu Maghrib Seterusnya (7:30 PM)";
        lockBtn.className = "flex-1 py-3.5 px-4 bg-slate-800 text-slate-500 rounded-xl text-sm font-bold cursor-not-allowed";
        infoText.innerText = `Kitaran seterusnya dibuka selepas 7:30 PM`;
      } else {
        targetLabel.innerText = nextDateToLock;
        badge.innerText = "Ada Tertunggak";
        badge.className = "inline-block mt-2 px-3 py-1 text-xs font-semibold rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30";
        lockBtn.disabled = false;
        lockBtn.innerText = `Kunci Hari ${nextDateToLock}`;
        lockBtn.className = "flex-1 py-3.5 px-4 bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] transition font-bold text-slate-950 rounded-xl text-sm shadow-lg shadow-emerald-950";
        infoText.innerText = `Menunggu pengesahan kitaran ${nextDateToLock}`;
      }

      // Papar sejarah dari 31/8 turun ke bawah
      const historyList = document.getElementById('historyList');
      if (!data || data.length === 0) {
        historyList.innerHTML = `<p class="text-slate-500 text-xs">Belum ada rekod.</p>`;
        return;
      }

      historyList.innerHTML = data.map(item => `
        <div class="flex items-center justify-between p-3 rounded-xl border bg-slate-900/60 border-slate-800/80">
          <div>
            <div class="font-medium text-slate-200">${item.cycle_date}</div>
            <div class="text-xs text-slate-400">${item.notes || 'Kitaran berjaya'}</div>
          </div>
          <span class="text-xs font-bold ${item.completed ? 'text-emerald-400' : 'text-rose-400'}">
            ${item.completed ? 'BERJAYA' : 'TERTINGGAL'}
          </span>
        </div>
      `).join('');
    }

    // 3. HANTAR REKOD
    async function markTargetComplete() {
      if (!nextDateToLock) return;

      const notes = document.getElementById('notesInput').value;
      const btn = document.getElementById('lockBtn');
      btn.disabled = true;
      btn.innerText = "Menyimpan...";

      const { error } = await db
        .from('maghrib')
        .upsert({ 
          cycle_date: nextDateToLock, 
          completed: true, 
          notes: notes || 'Kitaran berjaya'
        }, { onConflict: 'cycle_date' });

      if (error) {
        alert("Gagal simpan: " + error.message);
        btn.disabled = false;
      } else {
        document.getElementById('notesInput').value = "";
        await loadTrackerData();
      }
    }

    loadTrackerData();
  </script>
</body>
</html>
